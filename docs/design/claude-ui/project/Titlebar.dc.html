<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Windows 标题栏</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; height: 40px; box-sizing: border-box; display: flex; align-items: center; background: {{t.s0}}; color: {{t.tx}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 13px; user-select: none"
      >
        <div
          style="width: {{leftW}}; flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; box-sizing: border-box"
        >
          <svg width="20" height="20" viewBox="0 0 80 80" aria-hidden="true">
            <rect width="80" height="80" rx="20" fill="#d97757"></rect>
            <path
              d="M40 20 Q38 22 25 40 Q23 42 26 42 L30 42 Q32 40 40 30 Q48 40 50 42 L54 42 Q57 42 55 40 Q42 22 40 20"
              fill="#fff"
            ></path>
            <circle cx="40" cy="46" r="3" fill="#fff"></circle>
            <path d="M18 50 Q40 70 62 50" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
          </svg>
          <sc-if value="{{showName}}" hint-placeholder-val="{{ true }}">
            <span style="font-weight: 600; font-size: 13px; letter-spacing: 0.01em">AionUI</span>
          </sc-if>
          <span style="flex: 1"></span>
          <button
            aria-label="收起侧栏"
            style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M9 4v16"></path>
            </svg>
          </button>
        </div>
        <div
          style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 16px; color: {{t.tx2}}"
        >
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{title}}</span>
        </div>
        <div style="display: flex; height: 40px; flex: none">
          <button
            aria-label="最小化"
            style="width: 46px; height: 40px; border: 0; background: transparent; color: {{t.tx}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
          >
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M0 5h10" stroke="currentColor" stroke-width="1"></path>
            </svg>
          </button>
          <button
            aria-label="最大化"
            style="width: 46px; height: 40px; border: 0; background: transparent; color: {{t.tx}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
          >
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <rect
                x="0.5"
                y="0.5"
                width="9"
                height="9"
                rx="1"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
              ></rect>
            </svg>
          </button>
          <button
            aria-label="关闭"
            style="width: 46px; height: 40px; border: 0; background: transparent; color: {{t.tx}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
          >
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1"></path>
            </svg>
          </button>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"dark":{"editor":"boolean","default":false},"collapsed":{"editor":"boolean","default":false},"title":{"editor":null,"default":""},"$preview":{"width":1440,"height":40}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const dark = this.props.dark ?? false;
          const collapsed = this.props.collapsed ?? false;
          const t = dark
            ? { s0: '#0b0b0b', tx: '#f5f5f5', tx2: '#a3a3a3' }
            : { s0: '#f9f9f7', tx: '#151515', tx2: '#525252' };
          return {
            t,
            title: this.props.title ?? '',
            showName: !collapsed,
            leftW: collapsed ? '96px' : '260px',
          };
        }
      }
    </script>
  </body>
</html>
