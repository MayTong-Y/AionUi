<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>设置 · Agent</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; height: 900px; display: flex; flex-direction: column; background: {{t.s0}}; color: {{t.tx}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 14px; overflow: hidden"
      >
        <dc-import name="Titlebar" dark="{{dark}}" title="设置" hint-size="100%,40px"></dc-import>
        <div style="flex: 1; min-height: 0; display: flex">
          <nav
            aria-label="设置分类"
            style="
              width: 260px;
              flex: none;
              box-sizing: border-box;
              padding: 6px 8px;
              display: flex;
              flex-direction: column;
              gap: 1px;
              font-size: 13.5px;
            "
          >
            <a
              href="/Conversation.dc.html"
              style="height: 34px; border-radius: 8px; color: {{t.tx2}}; display: flex; align-items: center; gap: 8px; padding: 0 10px; text-decoration: none; margin-bottom: 8px"
              ><svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m15 18-6-6 6-6"></path></svg
              >返回</a
            >
            <a
              href="#model"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >模型</a
            >
            <a
              href="#assistants"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >助手</a
            >
            <a
              href="#agent"
              aria-current="page"
              style="height: 34px; border-radius: 8px; background: {{t.active}}; color: {{t.tx}}; font-weight: 500; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >Agent</a
            >
            <a
              href="#skills"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >技能</a
            >
            <a
              href="#tools"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >工具与 MCP</a
            >
            <a
              href="#appearance"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >外观</a
            >
            <a
              href="#webui"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >WebUI</a
            >
            <a
              href="#pet"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >桌宠</a
            >
            <a
              href="#archived"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >已归档</a
            >
            <a
              href="#system"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >系统</a
            >
            <a
              href="#about"
              style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 12px; text-decoration: none"
              >关于</a
            >
          </nav>
          <main
            style="flex: 1; min-width: 0; background: {{t.s1}}; border-top-left-radius: 12px; box-shadow: 0 0 0 1px {{t.a2}}; overflow: auto; display: flex; justify-content: center; padding: 0 40px"
          >
            <div
              style="
                width: 100%;
                max-width: 760px;
                padding: 44px 0 48px;
                display: flex;
                flex-direction: column;
                gap: 32px;
              "
            >
              <header style="display: flex; flex-direction: column; gap: 6px">
                <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 28px">Agent</h1>
                <p style="margin: 0; color: {{t.tx2}}; font-size: 14px; line-height: 1.6">
                  管理本机检测到的命令行 Agent，以及通过 ACP 协议接入的自定义代理。
                </p>
              </header>
              <section style="display: flex; flex-direction: column; gap: 10px">
                <h2 style="margin: 0; font-size: 14px; font-weight: 600">本地 Agent</h2>
                <div
                  style="border-radius: 12px; background: {{t.s2}}; box-shadow: 0 0 0 1px {{t.a2}}; display: flex; flex-direction: column"
                >
                  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
                    <span
                      style="width: 32px; height: 32px; border-radius: 8px; background: {{t.clayLight}}; color: {{t.clayText}}; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center"
                      >C</span
                    >
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"
                      ><span style="font-weight: 500">Claude Code</span
                      ><span
                        style="font-size: 12.5px; color: {{t.tx3}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                        >已检测 · C:\Users\MayTong\AppData\Roaming\npm\claude.cmd</span
                      ></span
                    >
                    <button
                      style="height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; box-shadow: inset 0 0 0 1px {{t.a3}}; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer"
                    >
                      配置
                    </button>
                    <button
                      role="switch"
                      aria-checked="true"
                      aria-label="启用 Claude Code"
                      style="
                        width: 36px;
                        height: 20px;
                        border: 0;
                        border-radius: 9999px;
                        background: #b5512f;
                        padding: 2px;
                        display: flex;
                        justify-content: flex-end;
                        cursor: pointer;
                      "
                    >
                      <span style="width: 16px; height: 16px; border-radius: 9999px; background: #fff"></span>
                    </button>
                  </div>
                  <div
                    style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid {{t.a2}}"
                  >
                    <span
                      style="width: 32px; height: 32px; border-radius: 8px; background: {{t.a1}}; color: {{t.tx}}; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center"
                      >X</span
                    >
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"
                      ><span style="font-weight: 500">Codex</span
                      ><span style="font-size: 12.5px; color: {{t.tx3}}">已检测 · codex</span></span
                    >
                    <button
                      style="height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; box-shadow: inset 0 0 0 1px {{t.a3}}; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer"
                    >
                      配置
                    </button>
                    <button
                      role="switch"
                      aria-checked="true"
                      aria-label="启用 Codex"
                      style="
                        width: 36px;
                        height: 20px;
                        border: 0;
                        border-radius: 9999px;
                        background: #b5512f;
                        padding: 2px;
                        display: flex;
                        justify-content: flex-end;
                        cursor: pointer;
                      "
                    >
                      <span style="width: 16px; height: 16px; border-radius: 9999px; background: #fff"></span>
                    </button>
                  </div>
                  <div
                    style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid {{t.a2}}"
                  >
                    <span
                      style="width: 32px; height: 32px; border-radius: 8px; background: {{t.blueTint}}; color: {{t.blueText}}; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center"
                      >G</span
                    >
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"
                      ><span style="font-weight: 500">Gemini CLI</span
                      ><span style="font-size: 12.5px; color: {{t.tx3}}">已检测 · gemini</span></span
                    >
                    <button
                      style="height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; box-shadow: inset 0 0 0 1px {{t.a3}}; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer"
                    >
                      配置
                    </button>
                    <button
                      role="switch"
                      aria-checked="false"
                      aria-label="启用 Gemini CLI"
                      style="width: 36px; height: 20px; border: 0; border-radius: 9999px; background: {{t.a3}}; padding: 2px; display: flex; justify-content: flex-start; cursor: pointer"
                    >
                      <span style="width: 16px; height: 16px; border-radius: 9999px; background: #fff"></span>
                    </button>
                  </div>
                  <div
                    style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid {{t.a2}}"
                  >
                    <span
                      style="width: 32px; height: 32px; border-radius: 8px; background: {{t.a1}}; color: {{t.tx2}}; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center"
                      >Q</span
                    >
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"
                      ><span style="font-weight: 500; color: {{t.tx2}}">Qwen Code</span
                      ><span style="font-size: 12.5px; color: {{t.tx3}}">未检测到 · 安装后重启 AionUI</span></span
                    >
                    <button
                      style="height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; box-shadow: inset 0 0 0 1px {{t.a3}}; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer"
                    >
                      安装说明
                    </button>
                  </div>
                </div>
              </section>
              <section style="display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <h2 style="margin: 0; font-size: 14px; font-weight: 600">自定义 ACP 代理</h2>
                  <button
                    style="height: 30px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; box-shadow: inset 0 0 0 1px {{t.a3}}; display: flex; align-items: center; gap: 6px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <path d="M12 5v14M5 12h14"></path></svg
                    >添加
                  </button>
                </div>
                <div
                  style="border-radius: 12px; box-shadow: inset 0 0 0 1px {{t.a2}}; padding: 28px 16px; text-align: center; color: {{t.tx3}}; font-size: 13.5px"
                >
                  暂无配置自定义代理
                </div>
              </section>
              <section style="display: flex; flex-direction: column; gap: 10px">
                <h2 style="margin: 0; font-size: 14px; font-weight: 600">运行</h2>
                <div
                  style="border-radius: 12px; background: {{t.s2}}; box-shadow: 0 0 0 1px {{t.a2}}; display: flex; align-items: center; gap: 16px; padding: 14px 16px"
                >
                  <label for="idle-timeout" style="flex: 1; display: flex; flex-direction: column; gap: 2px"
                    ><span style="font-weight: 500">Agent 空闲超时（分钟）</span
                    ><span style="font-size: 12.5px; color: {{t.tx3}}"
                      >空闲超过该时长后自动终止 Agent 进程以释放内存</span
                    ></label
                  >
                  <input
                    id="idle-timeout"
                    type="number"
                    value="30"
                    style="width: 88px; height: 32px; box-sizing: border-box; border: 0; outline: none; border-radius: 8px; background: {{t.s1}}; box-shadow: inset 0 0 0 1px {{t.a3}}; color: {{t.tx}}; font: inherit; font-size: 13.5px; padding: 0 10px"
                  />
                </div>
              </section>
            </div>
          </main>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const dark = this.props.dark ?? false;
          const t = dark
            ? { s0: '#0b0b0b', s1: '#151515', s2: '#1a1a19', a1: 'rgba(255,255,255,0.05)', a2: 'rgba(255,255,255,0.09)', a3: 'rgba(255,255,255,0.18)', active: 'rgba(255,255,255,0.09)', tx: '#f5f5f5', tx2: '#a3a3a3', tx3: '#8f8f8f', clayLight: 'rgba(217,119,87,0.16)', clayText: '#e08264', blueTint: '#1d2733', blueText: '#b9d3ee' }
            : { s0: '#f9f9f7', s1: '#fcfcfb', s2: '#ffffff', a1: 'rgba(20,20,20,0.05)', a2: 'rgba(20,20,20,0.10)', a3: 'rgba(20,20,20,0.20)', active: 'rgba(20,20,20,0.07)', tx: '#151515', tx2: '#525252', tx3: '#737373', clayLight: '#fbf3ef', clayText: '#b5512f', blueTint: '#f0f4f8', blueText: '#193c5f' };
          return { t, dark };
        }
      }
    </script>
  </body>
</html>
