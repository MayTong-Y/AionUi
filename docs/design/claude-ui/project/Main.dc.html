<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>欢迎页</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; height: 900px; display: flex; flex-direction: column; background: {{t.s0}}; color: {{t.tx}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 14px; overflow: hidden"
      >
        <dc-import name="Titlebar" dark="{{dark}}" title="" hint-size="100%,40px"></dc-import>
        <div style="flex: 1; min-height: 0; display: flex">
          <dc-import name="Sider" dark="{{dark}}" active="none" hint-size="260px,860px"></dc-import>
          <main
            style="flex: 1; min-width: 0; background: {{t.s1}}; border-top-left-radius: 12px; box-shadow: 0 0 0 1px {{t.a2}}; display: flex; flex-direction: column; align-items: center; overflow: auto; padding: 0 32px"
          >
            <div
              style="
                width: 100%;
                max-width: 720px;
                display: flex;
                flex-direction: column;
                gap: 28px;
                padding: 120px 0 48px;
              "
            >
              <div style="display: flex; align-items: center; justify-content: center; gap: 14px">
                <svg width="34" height="34" viewBox="0 0 80 80" aria-hidden="true">
                  <path
                    d="M40 20 Q38 22 25 40 Q23 42 26 42 L30 42 Q32 40 40 30 Q48 40 50 42 L54 42 Q57 42 55 40 Q42 22 40 20"
                    fill="#d97757"
                  ></path>
                  <circle cx="40" cy="46" r="3" fill="#d97757"></circle>
                  <path
                    d="M18 50 Q40 70 62 50"
                    stroke="#d97757"
                    stroke-width="3.5"
                    fill="none"
                    stroke-linecap="round"
                  ></path>
                </svg>
                <h1
                  style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 500; font-size: 38px; letter-spacing: -0.01em; color: {{t.tx}}"
                >
                  Hi，今天有什么安排？
                </h1>
              </div>
              <div
                style="background: {{t.s3}}; border-radius: 20px; box-shadow: {{t.composerSh}}; padding: 14px 14px 10px 18px; display: flex; flex-direction: column; gap: 10px"
              >
                <label
                  for="welcome-input"
                  style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"
                  >消息</label
                >
                <textarea
                  id="welcome-input"
                  rows="3"
                  placeholder="发消息、上传文件、打开文件夹、创建定时任务，或输入 / 唤起命令..."
                  style="border: 0; outline: none; resize: none; background: transparent; color: {{t.tx}}; font: inherit; font-size: 15px; line-height: 1.6; padding: 4px 0 0"
                ></textarea>
                <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
                  <button
                    aria-label="添加附件"
                    style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <path d="M12 5v14M5 12h14"></path>
                    </svg>
                  </button>
                  <button
                    style="height: 32px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; gap: 6px; padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    <svg
                      width="15"
                      height="15"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>
                    </svg>
                    选择项目
                  </button>
                  <span style="flex: 1"></span>
                  <button
                    style="height: 32px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 6px; padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    <span
                      style="width: 16px; height: 16px; border-radius: 4px; background: {{t.clayLight}}; color: {{t.clayText}}; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center"
                      >C</span
                    >
                    Claude Code
                    <svg
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <path d="m6 9 6 6 6-6"></path>
                    </svg>
                  </button>
                  <button
                    style="height: 32px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 6px; padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    选择模型
                    <svg
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <path d="m6 9 6 6 6-6"></path>
                    </svg>
                  </button>
                  <button
                    aria-label="发送"
                    style="
                      width: 32px;
                      height: 32px;
                      border: 0;
                      border-radius: 9999px;
                      background: #d97757;
                      color: #fff;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      cursor: pointer;
                      padding: 0;
                    "
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.25"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M12 19V5M5 12l7-7 7 7"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div style="font-size: 12.5px; color: {{t.tx3}}; padding: 0 4px">选择一位助手开始任务</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap">
                  <button
                    style="height: 34px; border: 0; border-radius: 9999px; background: {{t.clayLight}}; color: {{t.clayText}}; box-shadow: inset 0 0 0 1px {{t.clayRing}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer"
                  >
                    Claude Code
                  </button>
                  <button
                    style="height: 34px; border: 0; border-radius: 9999px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; padding: 0 14px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    Codex
                  </button>
                  <button
                    style="height: 34px; border: 0; border-radius: 9999px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; padding: 0 14px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    Gemini CLI
                  </button>
                  <button
                    style="height: 34px; border: 0; border-radius: 9999px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; padding: 0 14px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    Qwen Code
                  </button>
                  <button
                    style="height: 34px; border: 0; border-radius: 9999px; background: transparent; color: {{t.tx2}}; box-shadow: inset 0 0 0 1px {{t.a2}}; display: flex; align-items: center; gap: 6px; padding: 0 14px; font: inherit; font-size: 13px; cursor: pointer"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      aria-hidden="true"
                    >
                      <circle cx="5" cy="12" r="1"></circle>
                      <circle cx="12" cy="12" r="1"></circle>
                      <circle cx="19" cy="12" r="1"></circle>
                    </svg>
                    更多
                  </button>
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
                <section style="display: flex; flex-direction: column; gap: 4px">
                  <h2 style="margin: 0 0 6px; padding: 0 4px; font-size: 12.5px; font-weight: 500; color: {{t.tx3}}">
                    试试这些指令
                  </h2>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx}}; display: flex; align-items: flex-start; gap: 10px; padding: 10px; font: inherit; font-size: 13.5px; line-height: 1.5; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      style="flex: none; margin-top: 2px; color: {{t.tx3}}"
                    >
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"></path>
                      <path d="M20 17v4H6.5"></path>
                    </svg>
                    了解一下这个项目，用大白话告诉我它是做什么的、从哪里入手
                  </button>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx}}; display: flex; align-items: flex-start; gap: 10px; padding: 10px; font: inherit; font-size: 13.5px; line-height: 1.5; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      style="flex: none; margin-top: 2px; color: {{t.tx3}}"
                    >
                      <rect x="8" y="8" width="13" height="13" rx="2"></rect>
                      <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    帮我找出这个文件夹里重复和没用的文件，列出来让我确认
                  </button>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx}}; display: flex; align-items: flex-start; gap: 10px; padding: 10px; font: inherit; font-size: 13.5px; line-height: 1.5; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      style="flex: none; margin-top: 2px; color: {{t.tx3}}"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                      <path d="M3 9h18M8 4v5"></path>
                    </svg>
                    帮我做一个精美的个人主页网页，做好后直接打开给我看
                  </button>
                </section>
                <section style="display: flex; flex-direction: column; gap: 4px">
                  <h2 style="margin: 0 0 6px; padding: 0 4px; font-size: 12.5px; font-weight: 500; color: {{t.tx3}}">
                    在项目中工作
                  </h2>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 9px 10px; font: inherit; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      style="flex: none; color: {{t.tx3}}"
                    >
                      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>
                    </svg>
                    <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.35"
                      ><span style="font-size: 13.5px">AionUI</span
                      ><span
                        style="font-size: 12px; color: {{t.tx3}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                        >D:\AI\code\business\AionUI</span
                      ></span
                    >
                  </button>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 9px 10px; font: inherit; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      style="flex: none; color: {{t.tx3}}"
                    >
                      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>
                    </svg>
                    <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.35"
                      ><span style="font-size: 13.5px">下载</span
                      ><span style="font-size: 12px; color: {{t.tx3}}">C:\Users\MayTong\Downloads</span></span
                    >
                  </button>
                  <button
                    style="border: 0; border-radius: 10px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 10px; padding: 9px 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      aria-hidden="true"
                      style="flex: none"
                    >
                      <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    选择项目文件夹
                  </button>
                </section>
              </div>
            </div>
          </main>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const dark = this.props.dark ?? false;
          const t = dark
            ? { s0: '#0b0b0b', s1: '#151515', s3: '#20201f', a2: 'rgba(255,255,255,0.09)', tx: '#f5f5f5', tx2: '#a3a3a3', tx3: '#8f8f8f', clayLight: 'rgba(217,119,87,0.16)', clayText: '#e08264', clayRing: 'rgba(217,119,87,0.35)', composerSh: '0 4px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.09)' }
            : { s0: '#f9f9f7', s1: '#fcfcfb', s3: '#ffffff', a2: 'rgba(20,20,20,0.10)', tx: '#151515', tx2: '#525252', tx3: '#737373', clayLight: '#fbf3ef', clayText: '#b5512f', clayRing: 'rgba(217,119,87,0.35)', composerSh: '0 4px 20px rgba(0,0,0,0.035), inset 0 0 0 1px rgba(20,20,20,0.10)' };
          return { t, dark };
        }
      }
    </script>
  </body>
</html>
