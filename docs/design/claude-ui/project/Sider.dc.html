<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>侧栏</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <nav
        aria-label="主导航"
        style="width: {{w}}; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.s0}}; color: {{t.tx}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 13.5px"
      >
        <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 8px">
            <button
              style="height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; font-weight: 500; cursor: pointer; text-align: left"
            >
              <span
                style="
                  width: 22px;
                  height: 22px;
                  border-radius: 9999px;
                  background: #d97757;
                  color: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
                ><svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.25"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14"></path></svg
              ></span>
              新会话
            </button>
            <button
              style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; cursor: pointer; text-align: left"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              搜索
              <span style="margin-left: auto; font-size: 11.5px; color: {{t.tx3}}">Ctrl K</span>
            </button>
            <button
              style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; cursor: pointer; text-align: left"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="13" r="8"></circle>
                <path d="M12 9v4l2.5 2.5M9 2h6"></path>
              </svg>
              定时任务
              <span
                style="margin-left: auto; min-width: 18px; height: 18px; border-radius: 9999px; background: {{t.clayLight}}; color: {{t.clayText}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box"

            </button>
            <button
              style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; cursor: pointer; text-align: left"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3 3 8l9 5 9-5-9-5Z"></path>
                <path d="m3 13 9 5 9-5"></path>
              </svg>
              技能中心

          </div>
          <div
            style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 4px 8px"
          >
            <div

            >
              <span>团队</span>
              <button

                  height="14"

            </a>
            <a

              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-decoration: none"
            >
              <span
                style="width: 18px; height: 18px; border-radius: 5px; background: {{t.clayLight}}; color: {{t.clayText}}; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center"
                >研</span
              >
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">竞品调研</span>
            </a>
            <div
              style="display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px; font-size: 12px; color: {{t.tx3}}; font-weight: 500"
            >
              <span>最近</span>
              <button
                style="height: 22px; border: 0; border-radius: 6px; background: transparent; color: {{t.tx3}}; font: inherit; font-size: 12px; cursor: pointer; padding: 0 4px"
              >
                批量管理
              </button>
            </div>
            <div style="padding: 6px 10px 2px; font-size: 11.5px; color: {{t.tx3}}">今天</div>
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; background: {{convBg}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis"
              >梳理 AionUI 的项目结构</a
            >
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >找出下载文件夹里的重复文件</a
            >
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; gap: 6px; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-label="定时任务"
                role="img"
                style="flex: none; color: {{t.tx3}}"
              >
                <circle cx="12" cy="13" r="8"></circle>
                <path d="M12 9v4l2.5 2.5"></path>
              </svg>
              每日 AI 新闻汇总
            </a>
            <div style="padding: 10px 10px 2px; font-size: 11.5px; color: {{t.tx3}}">昨天</div>
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >做一个个人主页网页</a
            >
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >把周报整理成 Excel 表格</a
            >
            <div style="padding: 10px 10px 2px; font-size: 11.5px; color: {{t.tx3}}">最近 7 天</div>
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >Electron 打包签名报错排查</a
            >
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >翻译 README 为英文</a
            >
            <a
              href="/Conversation.dc.html"
              style="height: 32px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; padding: 0 10px; text-decoration: none; overflow: hidden; white-space: nowrap"
              >MCP 服务器配置说明</a
            >
          </div>
          <div style="border-top: 1px solid {{t.a2}}; padding: 8px; display: flex; align-items: center; gap: 4px">
            <button
              style="flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; cursor: pointer; text-align: left"
            >
              <span
                style="width: 28px; height: 28px; flex: none; border-radius: 9999px; background: {{t.blueTint}}; color: {{t.blueText}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center"
                >MT</span
              >
              <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25">
                <span style="font-weight: 500">MayTong</span>
                <span style="font-size: 11.5px; color: {{t.tx3}}">本机 · WebUI 已开启</span>
              </span>
            </button>
            <a
              href="/Settings.dc.html"
              aria-label="设置"
              style="width: 36px; height: 36px; flex: none; border-radius: 8px; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
                ></path>
              </svg>
            </a>
          </div>
        </sc-if>
        <sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
          <div
            style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px"
          >
            <button
              aria-label="新会话"
              style="
                width: 36px;
                height: 36px;
                border: 0;
                border-radius: 8px;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                padding: 0;
              "
            >
              <span
                style="
                  width: 24px;
                  height: 24px;
                  border-radius: 9999px;
                  background: #d97757;
                  color: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
                ><svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.25"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14"></path></svg
              ></span>
            </button>
            <button
              aria-label="搜索"
              style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
            </button>
            <button
              aria-label="定时任务"
              style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="13" r="8"></circle>
                <path d="M12 9v4l2.5 2.5M9 2h6"></path>
              </svg>
            </button>
            <button
              aria-label="技能中心"
              style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3 3 8l9 5 9-5-9-5Z"></path>
                <path d="m3 13 9 5 9-5"></path>
              </svg>
            </button>
            <button
              aria-label="团队"
              style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="9" cy="8" r="3.5"></circle>
                <path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path>
              </svg>
            </button>
            <button
              aria-label="会话历史"
              style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.8A8 8 0 1 1 21 12Z"></path>
              </svg>
            </button>
            <span style="flex: 1"></span>
            <a
              href="/Settings.dc.html"
              aria-label="设置"
              style="width: 36px; height: 36px; border-radius: 8px; color: {{t.tx2}}; display: flex; align-items: center; justify-content: center"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"
                ></path></svg
            ></a>
            <button
              aria-label="账户"
              style="
                width: 36px;
                height: 36px;
                border: 0;
                border-radius: 9999px;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                padding: 0;
              "
            >
              <span
                style="width: 28px; height: 28px; border-radius: 9999px; background: {{t.blueTint}}; color: {{t.blueText}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center"
                >MT</span
              >
            </button>
          </div>
        </sc-if>
      </nav>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"dark":{"editor":"boolean","default":false},"collapsed":{"editor":"boolean","default":false},"active":{"editor":"enum","options":["none","conversation","team"],"default":"conversation"},"$preview":{"width":260,"height":860}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const dark = this.props.dark ?? false;
          const collapsed = this.props.collapsed ?? false;
          const active = this.props.active ?? 'conversation';
          const t = dark
            ? { s0: '#0b0b0b', a1: 'rgba(255,255,255,0.05)', a2: 'rgba(255,255,255,0.09)', tx: '#f5f5f5', tx2: '#a3a3a3', tx3: '#8f8f8f', clayLight: 'rgba(217,119,87,0.16)', clayText: '#e08264', blueTint: '#1d2733', blueText: '#b9d3ee' }
            : { s0: '#f9f9f7', a1: 'rgba(20,20,20,0.05)', a2: 'rgba(20,20,20,0.10)', tx: '#151515', tx2: '#525252', tx3: '#737373', clayLight: '#fbf3ef', clayText: '#b5512f', blueTint: '#f0f4f8', blueText: '#193c5f' };
          return {
            t,
            expanded: !collapsed,
            collapsed,
            w: collapsed ? '56px' : '260px',
            convBg: active === 'conversation' ? (dark ? 'rgba(255,255,255,0.09)' : 'rgba(20,20,20,0.07)') : 'transparent',
            teamBg: active === 'team' ? (dark ? 'rgba(255,255,255,0.09)' : 'rgba(20,20,20,0.07)') : 'transparent',
            teamColor: t.tx,
          };
        }
      }
    </script>
  </body>
</html>
