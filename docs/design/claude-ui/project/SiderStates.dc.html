<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>侧栏展开与收起</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; height: 900px; box-sizing: border-box; display: flex; gap: 48px; padding: 4px 48px 0; background: {{t.s1}}; color: {{t.tx}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif; font-size: 14px; overflow: hidden"
      >
        <div style="display: flex; flex-direction: column; gap: 6px; flex: none">
          <div style="height: 26px; display: flex; align-items: center; font-size: 12.5px; color: {{t.tx3}}">
            展开 · 260px
          </div>
          <div style="border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px {{t.a2}}">
            <dc-import name="Sider" dark="{{dark}}" active="conversation" hint-size="260px,860px"></dc-import>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex: none">
          <div style="height: 26px; display: flex; align-items: center; font-size: 12.5px; color: {{t.tx3}}">
            收起 · 56px
          </div>
          <div style="border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px {{t.a2}}">
            <dc-import name="Sider" dark="{{dark}}" collapsed="{{ true }}" hint-size="56px,860px"></dc-import>
          </div>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 32px; padding-top: 32px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 12.5px; color: {{t.tx3}}">会话项菜单（悬停出现更多按钮，或右键）</div>
            <div
              style="width: 260px; border-radius: 10px; background: {{t.s0}}; box-shadow: 0 0 0 1px {{t.a2}}; padding: 6px"
            >
              <div
                style="height: 32px; border-radius: 8px; background: {{t.hover}}; display: flex; align-items: center; padding: 0 4px 0 10px; font-size: 13.5px"
              >
                <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                  >找出下载文件夹里的重复文件</span
                >
                <button
                  aria-label="更多操作"
                  style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: {{t.a2}}; color: {{t.tx}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.25"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <circle cx="5" cy="12" r="1"></circle>
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="19" cy="12" r="1"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div
              role="menu"
              aria-label="会话操作"
              style="width: 200px; margin-left: 150px; border-radius: 12px; background: {{t.pop}}; box-shadow: {{t.popSh}}; padding: 6px; display: flex; flex-direction: column; gap: 1px"
            >
              <button
                role="menuitem"
                style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"></path></svg
                >重命名
              </button>
              <button
                role="menuitem"
                style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 17v5M9 10.8V4h6v6.8l3 3.2H6l3-3.2Z"></path></svg
                >置顶
              </button>
              <button
                role="menuitem"
                style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="13" r="8"></circle>
                  <path d="M12 9v4l2.5 2.5M9 2h6"></path></svg
                >创建定时任务
              </button>
              <button
                role="menuitem"
                style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path></svg
                >归档
              </button>
              <div style="height: 1px; margin: 4px 6px; background: {{t.a2}}"></div>
              <button
                role="menuitem"
                style="height: 34px; border: 0; border-radius: 8px; background: transparent; color: {{t.danger}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg
                >删除
              </button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 12.5px; color: {{t.tx3}}">账户菜单（点击侧栏底部头像）</div>
            <div
              role="menu"
              aria-label="账户"
              style="width: 260px; border-radius: 12px; background: {{t.pop}}; box-shadow: {{t.popSh}}; padding: 6px; display: flex; flex-direction: column; gap: 1px"
            >
              <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 13.5px; font-weight: 500">MayTong</span>
                <span style="font-size: 12px; color: {{t.tx3}}">本机 · WebUI 已开启</span>
              </div>
              <div style="padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 12px; color: {{t.tx3}}">外观</span>
                <div
                  role="radiogroup"
                  aria-label="外观"
                  style="display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: {{t.track}}"
                >
                  <button
                    role="radio"
                    aria-checked="{{lightOn}}"
                    style="flex: 1; height: 26px; border: 0; border-radius: 6px; background: {{lightBg}}; box-shadow: {{lightSh}}; color: {{t.tx}}; font: inherit; font-size: 12.5px; cursor: pointer"
                  >
                    浅色
                  </button>
                  <button
                    role="radio"
                    aria-checked="{{darkOn}}"
                    style="flex: 1; height: 26px; border: 0; border-radius: 6px; background: {{darkBg}}; box-shadow: {{darkSh}}; color: {{t.tx}}; font: inherit; font-size: 12.5px; cursor: pointer"
                  >
                    深色
                  </button>
                  <button
                    role="radio"
                    aria-checked="false"
                    style="flex: 1; height: 26px; border: 0; border-radius: 6px; background: transparent; color: {{t.tx2}}; font: inherit; font-size: 12.5px; cursor: pointer"
                  >
                    跟随系统
                  </button>
                </div>
              </div>
              <div style="height: 1px; margin: 0 6px 4px; background: {{t.a2}}"></div>
              <a
                role="menuitem"
                href="/Settings.dc.html"
                style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13.5px; text-decoration: none"
                >设置<span style="margin-left: auto; font-size: 12px; color: {{t.tx3}}">Ctrl ,</span></a
              >
              <a
                role="menuitem"
                href="/Settings.dc.html"
                style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13.5px; text-decoration: none"
                >WebUI 远程访问</a
              >
              <a
                role="menuitem"
                href="/Settings.dc.html"
                style="height: 34px; border-radius: 8px; color: {{t.tx}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13.5px; text-decoration: none"
                >关于 AionUI</a
              >
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const dark = this.props.dark ?? false;
          const t = dark
            ? { s0: '#0b0b0b', s1: '#151515', pop: '#2c2c2a', a2: 'rgba(255,255,255,0.09)', hover: 'rgba(255,255,255,0.07)', tx: '#f5f5f5', tx2: '#a3a3a3', tx3: '#8f8f8f', danger: '#f87171', track: 'rgba(255,255,255,0.06)', thumb: '#3a3a37', popSh: '0 0 0 1px rgba(255,255,255,0.09), 0 4px 8px rgba(0,0,0,0.4), 0 12px 28px -2px rgba(0,0,0,0.4)' }
            : { s0: '#f9f9f7', s1: '#fcfcfb', pop: '#ffffff', a2: 'rgba(20,20,20,0.10)', hover: 'rgba(20,20,20,0.06)', tx: '#151515', tx2: '#525252', tx3: '#737373', danger: '#c62828', track: 'rgba(0,0,0,0.06)', thumb: '#ffffff', popSh: '0 0 0 1px rgba(20,20,20,0.10), 0 4px 8px rgba(0,0,0,0.06), 0 12px 28px -2px rgba(0,0,0,0.08)' };
          const on = (v) => (v ? t.thumb : 'transparent');
          const sh = (v) => (v ? '0 1px 2px rgba(0,0,0,0.12)' : 'none');
          return {
            t,
            dark,
            lightOn: !dark,
            darkOn: dark,
            lightBg: on(!dark),
            lightSh: sh(!dark),
            darkBg: on(dark),
            darkSh: sh(dark),
          };
        }
      }
    </script>
  </body>
</html>
